# Production stack for birja.nist.one. Standalone: never combine with the dev
# compose files. The project name is hardcoded so a shell variable cannot
# point this at the dev project. Env file: /etc/birja/prod.env (--env-file).
name: birja-prod

networks:
  data:
    internal: true
  app:
    ipam:
      config:
        - subnet: 172.29.50.0/24

volumes:
  pgdata:
  redisdata:

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    # Run the entrypoint as70: existing UID999 data must fail, never auto-chown.
    user: "70:70"
    image: cgr.dev/chainguard/postgres@sha256:f131db66371391e404c80cef7dd40f31b1b54eb264a6cb032925d9a3859f93f4
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: ${POSTGRES_USER:?set in /etc/birja/prod.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /etc/birja/prod.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in /etc/birja/prod.env}
    command:
      - -c
      - statement_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=30000
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/run/birja/db-server/server.crt
      - -c
      - ssl_key_file=/run/birja/db-server/server.key
      - -c
      - hba_file=/run/birja/db-hba/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql
      - /etc/birja/db-tls/server:/run/birja/db-server:ro
      - ./deploy/db:/run/birja/db-hba:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: cgr.dev/chainguard/redis@sha256:26bb2dd4412f902f3decd44fba5dfaef4360d97004d44f6cff7f28d6aba19c48
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in /etc/birja/prod.env}
    command: >
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      ENV: "prod"
      EMAIL_BACKEND: "resend"
      DATABASE_URL: ${APP_DATABASE_URL:?configure app role after verified recovery}
      DATABASE_SSL_CA_FILE: /run/birja/db-ca.crt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?set in /etc/birja/prod.env}
      JWT_SECRET: ${JWT_SECRET:?set in /etc/birja/prod.env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set in /etc/birja/prod.env}
      EMAIL_FROM: ${EMAIL_FROM:?set in /etc/birja/prod.env}
    volumes:
      - /etc/birja/db-tls/ca.crt:/run/birja/db-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.29.50.0/24
    networks: [data, app]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Price refresh loop (Kraken, every 60 s). Exactly ONE instance: never scale
  # it (deploy.sh does not) and never run the loop inside the backend. No
  # published ports. PRICE_SOURCE is hardcoded: prod must never read it from
  # the env file (fake prices are refused in prod by Settings as well).
  scheduler:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    stop_grace_period: 20s
    # Least privilege: no token, OTP or email secrets (SchedulerSettings needs none).
    environment:
      ENV: "prod"
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:?configure scheduler role after verified recovery}
      DATABASE_SSL_CA_FILE: /run/birja/db-ca.crt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PRICE_SOURCE: "kraken"
    volumes:
      - /etc/birja/db-tls/ca.crt:/run/birja/db-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.tasks.scheduler"]
    networks: [data, app]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/birja-scheduler-heartbeat') < 150 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Explicit one-shot DDL login. Never inherit web authentication/email secrets.
  migrate:
    profiles: [migrate]
    build:
      context: ./backend
      target: runtime
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      ENV: "prod"
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?configure migrator role after verified recovery}
      DATABASE_SSL_CA_FILE: /run/birja/db-ca.crt
      REDIS_URL: redis://unused.invalid:6379/0
    # Alembic loads Settings; these inert values satisfy its unrelated auth
    # fields and cannot authenticate real sessions. Redis/email are never used.
    command: [env, OTP_HMAC_SECRET=migration-unused-not-an-otp-secret-000000,
              JWT_SECRET=migration-unused-not-a-jwt-secret-000000,
              EMAIL_BACKEND=resend, RESEND_API_KEY=migration-unused,
              EMAIL_FROM=migration@example.invalid,
              alembic, upgrade, head]
    volumes:
      - /etc/birja/db-tls/ca.crt:/run/birja/db-ca.crt:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
