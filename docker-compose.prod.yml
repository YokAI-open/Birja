# Production stack for birja.nist.one. Standalone: never combine with the dev
# compose files. The project name is hardcoded so a shell variable cannot
# point this at the dev project. Env file: /etc/birja/prod.env (--env-file).
name: birja-prod

networks:
  data:
    internal: true
  app:
    ipam:
      config:
        - subnet: 172.29.50.0/24

volumes:
  pgdata:
  redisdata:

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in /etc/birja/prod.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /etc/birja/prod.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in /etc/birja/prod.env}
    command:
      - postgres
      - -c
      - statement_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=30000
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.3-trixie
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in /etc/birja/prod.env}
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      ENV: "prod"
      EMAIL_BACKEND: "resend"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?set in /etc/birja/prod.env}
      JWT_SECRET: ${JWT_SECRET:?set in /etc/birja/prod.env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set in /etc/birja/prod.env}
      EMAIL_FROM: ${EMAIL_FROM:?set in /etc/birja/prod.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.29.50.0/24
    networks: [data, app]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
