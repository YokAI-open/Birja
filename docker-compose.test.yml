# Isolated test stack. Throwaway test-only passwords, data on tmpfs,
# ports bound to 127.0.0.1 on non-default host ports so it never
# collides with the dev stack.
name: yokai-test

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: yokai_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: yokai_test
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yokai_test -d yokai_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.3-trixie
    command: ["redis-server", "--requirepass", "test", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=test redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
