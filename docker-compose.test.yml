# Isolated test stack. Throwaway test-only passwords, data on tmpfs,
# ports bound to 127.0.0.1 on non-default host ports so it never
# collides with the dev stack.
name: birja-test

services:
  postgres:
    # Run the entrypoint as70: existing UID999 data must fail, never auto-chown.
    user: "70:70"
    image: cgr.dev/chainguard/postgres@sha256:f131db66371391e404c80cef7dd40f31b1b54eb264a6cb032925d9a3859f93f4
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: birja_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: birja_test
    tmpfs:
      - /var/lib/postgresql:uid=70,gid=70,mode=0750
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birja_test -d birja_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: cgr.dev/chainguard/redis@sha256:26bb2dd4412f902f3decd44fba5dfaef4360d97004d44f6cff7f28d6aba19c48
    command: ["--requirepass", "test", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0750
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=test redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
