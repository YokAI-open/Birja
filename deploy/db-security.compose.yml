# Retained alongside the reviewed base Compose. Never merge a checkout's DB
# definition: only its application build context varies. Old asyncpg accepts
# ssl=verify-full; PGSSLROOTCERT supplies the public CA without code changes.
services:
  backend:
    build:
      context: ${BIRJA_APP_DIR:?retained entrypoint required}/backend
      dockerfile: ${BIRJA_OPS_DIR:?retained entrypoint required}/backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:?limited app login required}${BIRJA_OLD_TLS_SUFFIX:-}
      DATABASE_SSL_CA_FILE: /run/birja/db-ca.crt
      PGSSLROOTCERT: /run/birja/db-ca.crt
  scheduler:
    build:
      context: ${BIRJA_APP_DIR:?retained entrypoint required}/backend
      dockerfile: ${BIRJA_OPS_DIR:?retained entrypoint required}/backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${SCHEDULER_DATABASE_URL:?limited scheduler login required}${BIRJA_OLD_TLS_SUFFIX:-}
      DATABASE_SSL_CA_FILE: /run/birja/db-ca.crt
      PGSSLROOTCERT: /run/birja/db-ca.crt
  migrate:
    build:
      context: ${BIRJA_MIGRATOR_CONTEXT:?retained migration source required}
      dockerfile: ${BIRJA_OPS_DIR:?retained entrypoint required}/backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?limited migrator login required}
      DATABASE_SSL_CA_FILE: /run/birja/db-ca.crt
      PGSSLROOTCERT: /run/birja/db-ca.crt
