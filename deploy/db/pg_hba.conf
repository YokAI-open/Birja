# Local socket administration/backup is confined to the PostgreSQL container.
local all all trust
# No TCP plaintext, including loopback. No bootstrap login over the network.
hostnossl all all all reject
# PostgreSQL evaluates samenet against its actual directly attached data
# network; do not guess Docker's dynamically allocated subnet. Postgres must
# remain attached only to the internal data network (verified in rehearsal).
hostssl all birja_app,birja_scheduler,birja_migrator samenet scram-sha-256
host all all all reject
