# Shared security headers. add_header in a location drops the server-level
# ones, so every location that sets add_header includes this file again.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# style-src keeps 'unsafe-inline' because Radix/shadcn may set inline styles
# at runtime (RESEARCH A5). The CSP Playwright spec (plan 04) checks for zero
# violations.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
