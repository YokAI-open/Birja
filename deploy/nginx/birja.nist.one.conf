# nginx site for birja.nist.one (phase 02.1).
# nginx is added now because this is the first deploy outside local dev
# (CLAUDE.md "Infra" rule). Installed by deploy/install-nginx.sh.

server {
    listen 80;
    listen [::]:80;
    server_name birja.nist.one;
    server_tokens off;

    return 301 https://birja.nist.one$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name birja.nist.one;
    server_tokens off;

    # Real client IP from CF-Connecting-IP, only for Cloudflare peers
    # (generated by deploy/cloudflare-ips.sh).
    include /etc/nginx/snippets/birja-cloudflare-realip.conf;

    ssl_certificate /etc/nginx/certs/nist.one/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nist.one/key.pem;

    # Mirrors the existing nist.one site.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:BIRJA_SSL:10m;
    ssl_session_tickets off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 16k;
    limit_conn birja_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    root /var/www/birja/current;
    index index.html;

    include /etc/nginx/snippets/birja-security-headers.conf;

    error_page 429 = @birja_429;

    location @birja_429 {
        default_type application/json;
        add_header Retry-After 60 always;
        include /etc/nginx/snippets/birja-security-headers.conf;
        return 429 '{"detail":{"code":"rate_limited","message":"Too many requests. Try again in a minute."}}';
    }

    # Vite hashed output: a miss must 404, never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/birja-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/birja-security-headers.conf;
    }

    # Flood guard ahead of the app's own Redis limits.
    location /api/v1/auth/ {
        limit_req zone=birja_auth burst=20 nodelay;
        include /etc/nginx/snippets/birja-proxy.conf;
        proxy_pass http://127.0.0.1:18000;
    }

    location /api/ {
        include /etc/nginx/snippets/birja-proxy.conf;
        proxy_pass http://127.0.0.1:18000;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
