# Catch-all TLS server (WR-01). Installed by deploy/install-nginx.sh.
# Without it the first 443 server nginx loads (birja.nist.one) answers every
# unknown Host/SNI, so any Cloudflare zone pointed at this origin would serve
# the Birja app under a foreign domain. An unknown or missing SNI now fails
# the TLS handshake instead.
#
# birja.nist.one, nist.one, www.nist.one and *.nist.one keep their own server
# blocks (explicit server_name, selected by SNI), so they are unaffected.
#
# Port 80 needs no catch-all here: the stock `default` site already holds
# `listen 80 default_server` (a second one would fail nginx -t). It serves a
# local placeholder page, never the Birja app.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    # nginx >= 1.19.4 (host: 1.24.0). No certificate needed.
    ssl_reject_handshake on;

    # Same as the named sites; the default server's settings apply to the
    # handshake before SNI selects a server.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    return 444;
}
