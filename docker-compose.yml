name: ${COMPOSE_PROJECT_NAME:-birja}

networks:
  data:
    internal: true
  app:

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    # Run the entrypoint as70: existing UID999 data must fail, never auto-chown.
    user: "70:70"
    image: cgr.dev/chainguard/postgres@sha256:f131db66371391e404c80cef7dd40f31b1b54eb264a6cb032925d9a3859f93f4
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (cp .env.example .env)}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env (cp .env.example .env)}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: cgr.dev/chainguard/redis@sha256:26bb2dd4412f902f3decd44fba5dfaef4360d97004d44f6cff7f28d6aba19c48
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in .env (cp .env.example .env)}
    command: >
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      ENV: ${ENV:?set it in .env (cp .env.example .env)}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?set it in .env (cp .env.example .env)}
      JWT_SECRET: ${JWT_SECRET:?set it in .env (cp .env.example .env)}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Nonsecret discovery scope only; credentials belong to scheduler below.
      STOCK_DATA_ENABLED: ${STOCK_DATA_ENABLED:-false}
      STOCK_FEED: ${STOCK_FEED:-iex}
      STOCK_DATA_ACCOUNT: ${STOCK_DATA_ACCOUNT:-birja}
      STOCK_DATA_SERVER: ${STOCK_DATA_SERVER:-birja}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    networks: [data, app]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:5173/").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Price refresh loop. Exactly ONE instance: never scale it and never run the
  # loop inside the backend (uvicorn workers would each run it).
  scheduler:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    stop_grace_period: 20s
    # Least privilege: no token, OTP or email secrets (SchedulerSettings needs none).
    environment:
      ENV: ${ENV:?set it in .env (cp .env.example .env)}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PRICE_SOURCE: ${PRICE_SOURCE:-kraken}
      STOCK_DATA_ENABLED: ${STOCK_DATA_ENABLED:-false}
      STOCK_FEED: ${STOCK_FEED:-iex}
      STOCK_DATA_ACCOUNT: ${STOCK_DATA_ACCOUNT:-birja}
      STOCK_DATA_SERVER: ${STOCK_DATA_SERVER:-birja}
      STOCK_POLL_INTERVAL_SECONDS: ${STOCK_POLL_INTERVAL_SECONDS:-60}
      STOCK_REQUEST_TIMEOUT_SECONDS: ${STOCK_REQUEST_TIMEOUT_SECONDS:-5}
      STOCK_MAX_RETRIES: ${STOCK_MAX_RETRIES:-1}
      STOCK_CYCLE_BUDGET_SECONDS: ${STOCK_CYCLE_BUDGET_SECONDS:-15}
      STOCK_MAX_RESPONSE_BYTES: ${STOCK_MAX_RESPONSE_BYTES:-262144}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.tasks.scheduler"]
    networks: [data, app]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/birja-scheduler-heartbeat') < 150 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
