name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and dependencies
        working-directory: backend
        run: |
          uv python install
          uv sync --locked
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format
        working-directory: backend
        run: uv run ruff format --check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Pytest with coverage gate
        working-directory: backend
        run: uv run pytest --cov=app --cov-fail-under=80
      - name: Critical-path coverage (100%)
        working-directory: backend
        run: uv run coverage report --include=app/services/otp.py,app/services/auth.py,app/services/accounts.py,app/services/ratelimit.py,app/services/email.py,app/core/security.py,app/core/deps.py,app/services/price_rules.py,app/services/prices.py,app/services/trade_math.py,app/services/trading.py,app/services/portfolio_math.py,app/services/portfolio.py,app/services/history.py,app/api/v1/history.py --fail-under=100
      - name: Dependency audit
        working-directory: backend
        run: uv run pip-audit
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm run test -- --coverage
      - run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Offline image contracts
        run: |
          set -Eeuo pipefail
          mkdir -m 700 image-reports
          echo '{"ok":false,"stage":"build-not-completed"}' > image-reports/status.json
          python3 deploy/tests/test-image-contracts.py
          python3 deploy/tests/test-ci-ops.py
      - name: Build test image from uv.lock
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: test-builder
          load: true
          push: false
          tags: birja-backend-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          tags: birja-backend-runtime:ci
          load: true
          push: false
          cache-from: type=gha
      - name: Build verified Node toolchain
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: toolchain
          load: true
          push: false
          tags: birja-node-toolchain:ci
          cache-from: type=gha
      - name: Acquire immutable datastore and scanner images
        run: |
          set -Eeuo pipefail
          docker pull --platform linux/amd64 postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
          docker pull --platform linux/amd64 redis:8.8.4-trixie@sha256:a008e2cb5579f3616b29bd9e9913a25f16ec09ae2f56ddab524664663b581228
          docker pull --platform linux/amd64 aquasec/trivy@sha256:2e6c00d711ab4ae41d8a30c2c1fd3bd3b62704c177bb120f95012e939edfb3df
      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: In-image smoke test
        run: docker run --rm --network host birja-backend-test:ci pytest tests/test_smoke.py -q
      - name: Scan all five actual images
        if: always()
        run: |
          set -Eeuo pipefail
          python3 deploy/scan-images.py --output image-reports \
            --runtime "$(docker image inspect birja-backend-runtime:ci --format '{{.Id}}' 2> image-reports/runtime-resolve.log)" \
            --builder "$(docker image inspect birja-backend-test:ci --format '{{.Id}}' 2> image-reports/builder-resolve.log)" \
            --postgres postgres:18.6-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583 \
            --redis redis:8.8.4-trixie@sha256:a008e2cb5579f3616b29bd9e9913a25f16ec09ae2f56ddab524664663b581228 \
            --node "$(docker image inspect birja-node-toolchain:ci --format '{{.Id}}' 2> image-reports/node-resolve.log)"
      - name: Upload public image evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-reports
          path: image-reports
          if-no-files-found: error
          retention-days: 7
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create env file from placeholders
        run: |
          cp .env.example .env
          # CI must never call Kraken: the scheduler uses the offline fake source.
          sed -i 's/^PRICE_SOURCE=.*/PRICE_SOURCE=fake/' .env
          grep -qx 'PRICE_SOURCE=fake' .env
          grep -qx 'EMAIL_BACKEND=console' .env
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Install before the stack starts: the dev override's anonymous
      # /app/node_modules volume makes Docker create frontend/node_modules
      # on the host as root, which the runner user then can't write to.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Read Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # Install before the stack starts (see above). On a cache miss download
      # the browser and system deps; on a hit only the system libraries.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Start full stack
        run: docker compose up --build -d --wait
      - name: Run e2e
        working-directory: frontend
        run: npx playwright test
      - name: Show compose logs
        if: failure()
        run: docker compose logs --no-color | sed -E 's/code=[0-9]{6}/code=******/g; s/to=[^ ]+/to=***/g'
      # The report holds no server logs. Its traces may show a throwaway code
      # typed for an e2e-*@example.com account: accepted (dev-only, single-use,
      # ephemeral stack).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop full stack
        if: always()
        run: docker compose down -v

  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Acquire approved restic with signed checksum verification
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          tools=/tmp/birja-test-tools/restic-0.19.1
          mkdir -p "$tools/gnupg"
          chmod 700 "$tools" "$tools/gnupg"
          base=https://github.com/restic/restic/releases/download/v0.19.1
          for name in restic_0.19.1_linux_amd64.bz2 SHA256SUMS SHA256SUMS.asc; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 "$base/$name" -o "$tools/$name"
          done
          curl --fail --silent --show-error --proto '=https' --max-time 120 https://restic.net/gpg-key-alex.asc -o "$tools/gpg-key-alex.asc"
          echo 'e4f09134173fdd60ece4454d30e38459d172f3ea9a97b32a37324b4f0515a289  '"$tools/gpg-key-alex.asc" | sha256sum --check --status
          gpg --homedir "$tools/gnupg" --batch --no-autostart --import "$tools/gpg-key-alex.asc"
          gpg --homedir "$tools/gnupg" --batch --no-autostart --status-fd 1 --verify "$tools/SHA256SUMS.asc" "$tools/SHA256SUMS" > "$tools/signature-status"
          grep -Eq '^\[GNUPG:\] VALIDSIG CF8F18F2844575973F79D4E191A6868BD3F7A907 ' "$tools/signature-status"
          echo 'fb520966ee01d2a3d4219c66762c66efa56300833b6f639f36082b7462f91cb8  '"$tools/SHA256SUMS" | sha256sum --check --status
          echo '649f3a48d322c3d7a457ef58e2dc4c5094b1f823192cdbac3f092ea23e194d9a  '"$tools/SHA256SUMS.asc" | sha256sum --check --status
          echo 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  '"$tools/restic_0.19.1_linux_amd64.bz2" | sha256sum --check --status
          bzcat "$tools/restic_0.19.1_linux_amd64.bz2" > "$tools/restic"
          echo '20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639  '"$tools/restic" | sha256sum --check --status
          chmod 700 "$tools/restic"
          "$tools/restic" version
      - name: Build locked operations fixture image
        run: docker build --target test-builder -t birja-backend-test:phase05-07 backend
      - name: Offline operational contracts
        run: |
          set -Eeuo pipefail
          python3 deploy/tests/test-ci-ops.py
          bash deploy/tests/test-backup.sh
          bash deploy/tests/test-restore-safety.sh
          bash deploy/tests/test-db-config.sh
          python3 deploy/tests/test-deploy-prerequisites.py
          bash deploy/tests/test-reexec.sh
          bash deploy/tests/test-rollback-target.sh
          bash deploy/tests/test-app-services.sh
          bash deploy/tests/test-smoke-ports.sh
          bash deploy/tests/test-smoke-trading.sh
          bash deploy/check-nginx-config.sh
      - name: Serial real PostgreSQL recovery roles TLS and old-image rollback
        run: |
          set -Eeuo pipefail
          bash deploy/tests/test-db-operations.sh --all
          bash deploy/tests/test-rollback-db-security.sh
      - name: Clean fixed synthetic projects
        if: always()
        run: |
          set -Eeuo pipefail
          result=0
          for project in birja-ops-test birja-restore-check; do
            docker compose -p "$project" --env-file /dev/null -f "$GITHUB_WORKSPACE/docker-compose.ops-test.yml" down --volumes --remove-orphans --timeout 10 || result=1
          done
          exit "$result"

  ci-pass:
    needs: [backend, frontend, image, e2e, ops]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed" >&2
            exit 1
          fi
          echo "All CI jobs succeeded"
