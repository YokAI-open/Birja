name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and dependencies
        working-directory: backend
        run: |
          uv python install
          uv sync --locked
      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .
      - name: Ruff format
        working-directory: backend
        run: uv run ruff format --check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Pytest with coverage gate
        working-directory: backend
        run: uv run pytest --cov=app --cov-fail-under=80
      - name: Critical-path coverage (100%)
        working-directory: backend
        run: uv run coverage report --include=app/services/otp.py,app/services/auth.py,app/services/accounts.py,app/services/ratelimit.py,app/services/email.py,app/core/security.py,app/core/deps.py,app/services/price_rules.py,app/services/prices.py --fail-under=100
      - name: Dependency audit
        working-directory: backend
        run: uv run pip-audit
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .
      - run: npm run test -- --coverage
      - run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image from uv.lock
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: test-builder
          load: true
          push: false
          tags: birja-backend-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          load: false
          push: false
          cache-from: type=gha
      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: In-image smoke test
        run: docker run --rm --network host birja-backend-test:ci pytest tests/test_smoke.py -q
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create env file from placeholders
        run: cp .env.example .env
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Install before the stack starts: the dev override's anonymous
      # /app/node_modules volume makes Docker create frontend/node_modules
      # on the host as root, which the runner user then can't write to.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Read Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # Install before the stack starts (see above). On a cache miss download
      # the browser and system deps; on a hit only the system libraries.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Start full stack
        run: docker compose up --build -d --wait
      - name: Run e2e
        working-directory: frontend
        run: npx playwright test
      - name: Show compose logs
        if: failure()
        run: docker compose logs --no-color | sed -E 's/code=[0-9]{6}/code=******/g; s/to=[^ ]+/to=***/g'
      # The report holds no server logs. Its traces may show a throwaway code
      # typed for an e2e-*@example.com account: accepted (dev-only, single-use,
      # ephemeral stack).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Stop full stack
        if: always()
        run: docker compose down -v

  ci-pass:
    needs: [backend, frontend, image, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more required jobs did not succeed" >&2
            exit 1
          fi
          echo "All CI jobs succeeded"
